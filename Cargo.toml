[package]
name = "rexec"
version = "2.0.0"
authors = ["stnikiforov55 <stan DOT_PERIOD vd AT_SYM tutanota DOT_PERIOD com>"]
edition = "2018"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
actix-web = "4"
actix-web-lab = "0.24.1"
chrono = "0.4"
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = {version = "4.5", default-features = true, features = ["derive", "cargo"] }
log = { version = "0.4"}
simplelog = "^0.12"