[package]
name = "rexec"
version = "1.1.3"
authors = ["stnikiforov55 <stnikiforov@icloud.com>"]
edition = "2018"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
futures = {version="0.3"}
futures-util = "0.3"
http-body-util = { version = "0.1"}
http-body = {version = "0.1"}
tokio = { version = "1", features = ["full"] }
hyper = {version = "1.6", features = ["full"]}
hyper-util = { version="0.1", features=["server-graceful","http1","tokio"]}
serde = { version = "1.0", features = ["derive"] }
tungstenite = { version="0.26"}
tokio-tungstenite = { version="0.26"}
serde_json = "1.0"
clap = {version = "4.5", default-features = true, features = ["derive", "cargo"] }
log = { version = "0.4"}
simplelog = "^0.12"