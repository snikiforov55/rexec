<html>
<head>
<!-- <meta name="color-scheme" content="light dark"/> -->
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
    @media (prefers-color-scheme: light) {
        :root{
            --color-bg0: #A7A7A7;
            --color-bg1: #AAAAAA;
            --color-bg2: #ADADAD;
            --text-color: #2F2F2F;
        }
    }
    @media (prefers-color-scheme: dark) {
        :root{
            /*--color-bg0: "#040404";*/
            --color-bg0: #1F1F1F;
            --color-bg1: #2B2B2B;
            --color-bg2: #2F2F2F;
            --text-color: #D7D7D7;
        }
    }
    * {
        box-sizing: border-box; 
        color: var(--text-color);
        font-family: Verdana, Geneva, Tahoma, sans-serif;
    }
    html,
    body{
        width: 100vw;
        height: 100vh;
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        background-color: var(--color-bg0);
    }
    .level-zero{
        background-color: var(--color-bg0);
    }
    .level-one{
        background-color: var(--color-bg1);
    }
    .level-two{
        background-color: var(--color-bg1);
    }
</style>
</head>
<body>
<div class="level-zero" style="display:flex; padding:1em; flex:auto; height: 100%; width:100%; flex-direction: column;" >
